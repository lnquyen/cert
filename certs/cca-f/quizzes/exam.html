<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Certified Architect — Foundations Practice Exam</title>
<script>(function(){try{var t=localStorage.getItem('cert-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../../../core/css/style.css">
<link rel="stylesheet" href="../../../core/css/quiz.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<header class="site-nav" id="siteNav"></header>
<header class="top">
  <div class="inner">
    <div class="header-bar">
      <h1>Claude Certified Architect — Foundations</h1>
      <div class="header-progress">
        <div class="stat" id="statSelected">Selected: <span class="num" id="answeredCount">0</span>/<span id="totalCount">0</span></div>
        <div class="stat" id="statScore" style="display:none;">Score: <span class="num" id="correctCount">0</span>/<span id="totalCountScore">0</span> (<span id="scorePct">0</span>%)</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="header-actions">
        <button class="reset submit-exam-btn" id="submitExamBtn">Submit</button>
        <button class="reset ghost" id="resetBtn">Reset</button>
        <button class="reset ghost details-toggle" id="detailsToggle" aria-expanded="false" aria-controls="headerDetails">Filters &amp; stats <span class="caret">▾</span></button>
        <label class="theme-toggle-pill"><input type="checkbox" class="theme-toggle-input"> 🌙</label>
      </div>
    </div>
    <div class="header-details" id="headerDetails" hidden>
      <div class="sub" id="subText">Practice Exam — select your answers, then submit the whole exam to see your report.</div>
      <label class="shuffle-toggle" title="When on, Reset Exam shuffles question order and answer order. When off, Reset Exam keeps original order.">
        <span class="switch">
          <input type="checkbox" id="shuffleToggle" checked>
          <span class="slider"></span>
        </span>
        <span class="toggle-label">Shuffle on reset</span>
      </label>
      <div class="filterbar" id="filterBarWrap">
        <div class="filtertitle">Filter by domain</div>
        <div class="filterchips" id="filterChips"></div>
      </div>
      <div class="domainstats">
        <div class="filtertitle" id="domainStatsTitle">Progress by domain</div>
        <div id="domainStatsBody"></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="reportSummary" style="display:none;"></div>
  <div class="pagebar" id="pagebarTop"></div>
  <div id="quizContainer"></div>
  <div class="pagebar" id="pagebarBottom"></div>
</div>

<script>window.CERT_INDEX_PATH = "../"; window.CERT_ACTIVE_TAB = "quizzes";</script>
<script src="../data/nav.js"></script>
<script src="../../../core/js/theme-toggle.js"></script>
<script src="../../../core/js/site-nav.js"></script>
<script src="../data/vi-translations-setA.js"></script>
<script src="../data/exam-questions.js"></script>
<script>
  window.QUIZ_CONFIG = {
    title: "Practice Exam",
    mode: "exam",
    pageSize: 25,
    viTranslations: "VI_TRANSLATIONS_A",
    domainList: ["D1", "D2", "D3", "D4", "D5"],
    domainNames: {
      D1: "Agentic Architecture & Orchestration",
      D2: "Tool Design & MCP Integration",
      D3: "Claude Code Configuration & Workflows",
      D4: "Prompt Engineering & Structured Output",
      D5: "Context Management & Reliability"
    }
  };
</script>
<script src="../../../core/js/quiz-engine.js"></script>
</body>
</html>
