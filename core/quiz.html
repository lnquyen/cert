<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Cert Prep</title>
<script>(function(){try{var t=localStorage.getItem('cert-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script>
  (function(){
    var params = new URLSearchParams(location.search);
    var certId = params.get('cert') || '';
    if (!/^[a-z0-9-]+$/.test(certId)) certId = '';
    window.CERT_ID = certId;
    window.CERT_ACTIVE_TAB = 'quiz';
    if (certId) {
      window.CERT_INDEX_PATH = '../certs/' + certId + '/';
      document.write('<link rel="stylesheet" href="../certs/' + certId + '/theme.css">');
      document.write('<script src="../certs/' + certId + '/data/nav.js"><\/script>');
    }
  })();
</script>
<!-- theme.css (written above) loads before style.css/quiz.css here, the
     reverse of cert index pages — harmless today since theme.css only
     defines palette vars (--bg/--ink/--accent/--d1..d5) with no overlap in
     style.css's/quiz.css's own :root tokens (--radius/--page-max/etc.), but
     keep that non-overlap in mind before adding a shared var name to either. -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/quiz.css">
<script src="js/access-gate.js"></script>
</head>
<body>
<header class="site-nav" id="siteNav"></header>

<div id="quizRoot"></div>

<template id="tpl-practice">
  <div class="app">
    <header class="top">
      <div class="kicker" data-field="kicker"></div>
      <h1 data-field="title"></h1>
      <p data-field="description"></p>
    </header>

    <div class="card" id="start-screen">
      <div class="stats">
        <div class="stat-box">
          <div class="num" id="total-q-count">0</div>
          <div class="label">Questions</div>
        </div>
        <div class="stat-box">
          <div class="num">4</div>
          <div class="label">Choices Each</div>
        </div>
        <div class="stat-box">
          <div class="num">&infin;</div>
          <div class="label">Attempts</div>
        </div>
      </div>

      <div style="color:var(--muted); font-size:13px; margin-bottom:6px; font-weight:600;">Choose a mode</div>
      <div class="mode-select">
        <button class="mode-btn active" data-mode="all">All Questions</button>
        <button class="mode-btn" data-mode="random20">Random 20</button>
        <button class="mode-btn" data-mode="random50">Random 50</button>
        <button class="mode-btn" data-mode="custom">Custom Range</button>
      </div>

      <div class="range-row" id="custom-range-row" style="display:none;">
        <span>From #</span>
        <input type="number" id="range-start" min="1" value="1">
        <span>to #</span>
        <input type="number" id="range-end" min="1" value="20">
      </div>

      <button class="primary-btn" id="start-btn">Start Quiz</button>
    </div>

    <div class="card" id="quiz-screen">
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="progress-text">Question 1</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%;"></div>
        </div>
        <div class="score-pill">
          <span>Correct: <span class="correct" id="score-correct">0</span></span>
          <span>Wrong: <span class="wrong" id="score-wrong">0</span></span>
        </div>
      </div>

      <div class="qnum-badge" id="qnum-badge">QUESTION 1</div>
      <p class="question-text" id="question-text"></p>
      <button type="button" class="vi-btn" id="q-vi-btn"><svg class="flag-vn" viewBox="0 0 30 20" width="16" height="11" aria-hidden="true"><rect width="30" height="20" fill="#da251d"/><polygon points="15,4 16.76,9.53 22.57,9.53 17.9,13 19.66,18.53 15,15.06 10.34,18.53 12.1,13 7.43,9.53 13.24,9.53" fill="#ffcd00"/></svg> VN</button>
      <button type="button" class="copy-btn" id="q-copy-btn">📋 Copy</button>
      <div class="vi-box" id="q-vi-box"></div>
      <div class="options" id="options-container"></div>

      <div class="feedback-banner" id="feedback-banner"></div>
      <div class="hint-block" id="hint-block">
        <span class="hint-label" id="hint-label"></span>
        <span id="hint-text"></span>
        <button type="button" class="vi-btn" id="hint-vi-btn"><svg class="flag-vn" viewBox="0 0 30 20" width="16" height="11" aria-hidden="true"><rect width="30" height="20" fill="#da251d"/><polygon points="15,4 16.76,9.53 22.57,9.53 17.9,13 19.66,18.53 15,15.06 10.34,18.53 12.1,13 7.43,9.53 13.24,9.53" fill="#ffcd00"/></svg> VN</button>
        <div class="vi-box" id="hint-vi-box"></div>
      </div>

      <div class="nav-row">
        <button class="btn-flat" id="prev-btn">&larr; Previous</button>
        <button class="btn-next" id="next-btn" disabled>Next &rarr;</button>
      </div>
    </div>

    <div class="card" id="results-screen">
      <div class="big-score-label">Your Score</div>
      <div class="big-score" id="final-score">0 / 0</div>
      <div class="pct" id="final-pct">0% correct</div>

      <div class="result-stats">
        <div class="stat-box">
          <div class="num" style="color:var(--green);" id="final-correct">0</div>
          <div class="label">Correct</div>
        </div>
        <div class="stat-box">
          <div class="num" style="color:var(--red);" id="final-wrong">0</div>
          <div class="label">Wrong</div>
        </div>
      </div>

      <button class="primary-btn" id="restart-btn">Try Again</button>
      <button class="secondary-btn" id="review-toggle-btn">Show Question Review</button>

      <div class="review-list" id="review-list" style="display:none;"></div>
    </div>

    <footer class="foot" data-field="footer"></footer>
  </div>
</template>

<template id="tpl-exam">
  <header class="top">
    <div class="inner">
      <div class="header-bar">
        <h1 data-field="title"></h1>
        <div class="header-progress">
          <div class="stat" id="statSelected">Selected: <span class="num" id="answeredCount">0</span>/<span id="totalCount">0</span></div>
          <div class="stat" id="statScore" style="display:none;">Score: <span class="num" id="correctCount">0</span>/<span id="totalCountScore">0</span> (<span id="scorePct">0</span>%)</div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="header-actions">
          <button class="reset submit-exam-btn" id="submitExamBtn">Submit</button>
          <button class="reset ghost" id="resetBtn">Reset</button>
          <button class="reset ghost details-toggle" id="detailsToggle" aria-expanded="false" aria-controls="headerDetails">Filters &amp; stats <span class="caret">▾</span></button>
        </div>
      </div>
      <div class="header-details" id="headerDetails" hidden>
        <div class="sub" id="subText"></div>
        <label class="shuffle-toggle" title="When on, Reset Exam shuffles question order and answer order. When off, Reset Exam keeps original order.">
          <span class="switch">
            <input type="checkbox" id="shuffleToggle" checked>
            <span class="slider"></span>
          </span>
          <span class="toggle-label">Shuffle on reset</span>
        </label>
        <div class="filterbar" id="filterBarWrap">
          <div class="filtertitle">Filter by domain</div>
          <div class="filterchips" id="filterChips"></div>
        </div>
        <div class="domainstats">
          <div class="filtertitle" id="domainStatsTitle">Progress by domain</div>
          <div id="domainStatsBody"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="reportSummary" style="display:none;"></div>
    <div class="pagebar" id="pagebarTop"></div>
    <div id="quizContainer"></div>
    <div class="pagebar" id="pagebarBottom"></div>
  </div>
</template>

<script src="js/site-nav.js"></script>
<script src="js/theme-toggle.js"></script>
<script src="js/quiz-engine.js"></script>
<script src="js/quiz-page.js"></script>
</body>
</html>
